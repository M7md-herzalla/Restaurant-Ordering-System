<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | M O J</title>
    <Link rel="stylesheet" href="../Style.css">

</head>
<body class="page-profile">
        <header class="mainHeader">
        <div class="header-Logo"> M O J </div>
       
        <nav class="headerList">
       <ul>
        <li><a href="../Home.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="about & contact us.html">About & Contact</a></li>
        <li data-guest-only hidden><a href="register.html">Sign In</a></li>

        </ul>
        </nav>
    
         </nav>
        <nav class="profile">
          <ul class="profile">
        <li class="nav-account-slot"> <a
    href="./profile.html"
    class="account-link"
    aria-label="My account"
    data-user-only hidden
  >
    <span id="navAccountText">Sign in</span>
    <img id="navAccountPhoto" alt="" hidden>
  </a>
</li>
          </ul>
        </nav>
    </header>
 <main class="auth-page">
<p id="profileStatus" role="status">
      Checking your session…
    </p>
        <section
      id="profileContent"
      class="auth-form profile-card"
      hidden
    >
            <div class="name-resturant">
                <h1>M O J</h1>
            </div>
           
            <div
        id="profileAvatar"
        class="profile-avatar"
        aria-hidden="true"
      ></div>

      <h1>My Profile</h1>
         <form id="profileForm" class="profile-fields">
        <label for="profileName">Full name</label>
        <input
          id="profileName"
          type="text"
          autocomplete="name"
          maxlength="80"
          required
        >

        <label for="profileEmail">Email</label>
        <input
          id="profileEmail"
          type="email"
          readonly
        >

        <p class="profile-method">
          Sign-in methods:
          <span id="profileProvider"></span>
        </p>

        <button
          id="saveProfileBtn"
          type="submit"
          disabled
        >
          Save changes
        </button>
      </form>

      <button
  id="changePasswordBtn"
  class="profile-logout"
  type="button"
  hidden
  disabled
>
  Change password
</button>
      
      <button
        id="logoutBtn"
        class="profile-logout"
        type="button"
        disabled
      >
        Sign out
      </button>

      <p
        id="profileMessage"
        class="auth-message"
        role="status"
      ></p>
        </section>
 </main>
 <script type="module" src="../js/firebase/header-auth.js"></script>
 <script
   type="module" src="../js/firebase/profile.js" ></script>
</body>
</html>
