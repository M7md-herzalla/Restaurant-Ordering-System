<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regiter |  M O J</title>

<link rel="stylesheet" href="../Style.css">

</head>
<body>
    
<main class="auth-page">
    
  <form id="registerForm" class="auth-form">
    <h1 class="name-resturant">M O J</h1>
    <h1>Create Account</h1>



    <label for="registerName">Full name*</label>
<input
  id="registerName"
  type="text"
  autocomplete="name"
  maxlength="80"
  required
>

    <label for="registerEmail">Email*</label>
    <input
      id="registerEmail"
      type="email"
      autocomplete="email"
      required
    >

   <label for="registerPassword">Password*</label>

    <div class="password-field">
  <input
    id="registerPassword"
    type="password"
    autocomplete="new-password"
    aria-describedby="passwordHelp"
    required
  >

  <button
    type="button"
    class="password-toggle"
    data-password-target="registerPassword"
    aria-controls="registerPassword"
    aria-label="Show password"
    aria-pressed="false"
  >😣</button>
</div>
    <p id="passwordHelp" role="status" hidden>
  **Use at least 8 characters, one uppercase letter,
  two numbers, and one special character.
</p>
    <label for="registerConfirmPassword">Confirm password*</label>
<div class="password-field">
  <input
    id="registerConfirmPassword"
    type="password"
    autocomplete="new-password"
    required
  >

  <button
    type="button"
    class="password-toggle"
    data-password-target="registerConfirmPassword"
    aria-controls="registerConfirmPassword"
    aria-label="Show password"
    aria-pressed="false"
  >😣</button>
</div>


    <button id="registerBtn" type="submit" disabled>
      Create Account
    </button>
    <p class="auth-divider">or</p>
<button
  id="googleSignInBtn"
  class="google-sign-in"
  type="button"
  disabled
>
  <img
    src="https://developers.google.com/static/identity/images/g-logo.png"
    alt=""
    width="20"
    height="20"
  >
  <span id="googleButtonText">Continue with Google</span>
</button>


<p class="auth-switch">
  Already have an account?
  <a href="./login.html">Sign in</a>
</p>



    <p id="authMessage" role="status">Preparing…</p>
  </form>
</main>



<script src="../javaScript.js"></script>

    <script
  type="module"
  src="../js/firebase/register.js"
></script>
</body>
</html>
